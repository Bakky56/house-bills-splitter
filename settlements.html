<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settlements | House Bills Splitter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <header class="page-heading simple-heading">
        <div>
          <p class="eyebrow">SETTLE UP</p>
          <h1>Settlements</h1>
          <p class="hero-description">The fewest payments needed so everyone ends up even.</p>
        </div>
      </header>

      <div class="house-picker">
        <label for="houseSelect" class="form-label mb-0">House:</label>
        <select id="houseSelect" class="form-select"></select>
      </div>

      <section class="simple-card list-container">
        <div class="section-heading simple-section-heading"><h2>Suggested repayments</h2></div>
        <div id="suggestionsList"></div>
      </section>

      <section class="simple-card list-container mt-4">
        <div class="section-heading simple-section-heading"><h2>Record a payment</h2></div>
        <form id="paymentForm" class="filter-row">
          <select id="paymentFrom" class="form-select" aria-label="Who paid" required></select>
          <select id="paymentTo" class="form-select" aria-label="Who received" required></select>
          <input id="paymentAmount" class="form-control" type="number" min="0.01" step="0.01" placeholder="Amount (₦)" aria-label="Amount" required>
          <button class="btn btn-primary" type="submit">Record payment</button>
        </form>
        <p id="paymentMessage" class="form-message" role="status"></p>
      </section>

      <section class="simple-card list-container mt-4 mb-4">
        <div class="section-heading simple-section-heading"><h2>Payment history</h2></div>
        <div id="historyList"></div>
      </section>
    </main>
  </div>

<script src="script.js"></script>
  <div id="appToastContainer" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:2000" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
