<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balances | House Bills Splitter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <header class="page-heading simple-heading">
        <div>
          <p class="eyebrow">WHO OWES WHAT</p>
          <h1>Balances</h1>
          <p class="hero-description">See what each person paid, their share of the costs, and where they stand.</p>
        </div>
      </header>

      <div class="house-picker">
        <label for="houseSelect" class="form-label mb-0">House:</label>
        <select id="houseSelect" class="form-select"></select>
      </div>

      <section class="simple-card list-container">
        <div id="balancesList"></div>
        <p id="sumCheck" class="sum-check"></p>
      </section>
    </main>
  </div>

<script src="script.js"></script>
  <div id="appToastContainer" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:2000" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
