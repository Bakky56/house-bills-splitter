<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Houses & Members | House Bills Splitter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./Styles.css">
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <header class="page-heading simple-heading">
        <div>
          <p class="eyebrow">MANAGE YOUR HOUSEHOLD</p>
          <h1>Houses & Members</h1>
          <p class="hero-description">Create a house, then add the people who share its bills.</p>
        </div>
      </header>

      <div class="row g-4">
        <section class="col-12 col-lg-6">
          <div class="content-card simple-card">
            <h2 class="section-title"><i class="fa-solid fa-house me-2"></i>Create a house</h2>
            <form id="createHouseForm">
              <div class="mb-3">
                <label for="houseName" class="form-label">House name</label>
                <input id="houseName" class="form-control" type="text" placeholder="e.g. Flat 3B" maxlength="100" required>
              </div>
              <div class="mb-3">
                <label for="houseAddress" class="form-label">Address</label>
                <input id="houseAddress" class="form-control" type="text" placeholder="e.g. Yaba, Lagos" maxlength="200" required>
              </div>
              <p id="formMessage" class="form-message" role="status"></p>
              <button class="btn btn-primary" type="submit">Create house</button>
              <button class="btn btn-outline-danger ms-2" id="deleteHouseButton" type="button" disabled>Delete selected</button>
            </form>
          </div>
        </section>

        <section class="col-12 col-lg-6">
          <div class="content-card simple-card">
            <h2 class="section-title"><i class="fa-solid fa-user-plus me-2"></i>Add a member</h2>
            <form id="addMemberForm">
              <div class="mb-3">
                <label for="memberHouse" class="form-label">House</label>
                <select id="memberHouse" class="form-select" required>
                  <option value="">Choose a house</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="memberName" class="form-label">Member name</label>
                <input id="memberName" class="form-control" type="text" placeholder="e.g. John" maxlength="100" required>
              </div>
              <p id="memberMessage" class="form-message" role="status"></p>
              <button class="btn btn-primary" type="submit">Add member</button>
            </form>
          </div>
        </section>
      </div>

      <section class="content-card simple-card list-container mt-4">
        <div class="section-heading simple-section-heading">
          <h2>Your houses</h2>
          <span id="houseCount" class="text-secondary">0 houses</span>
        </div>
        <div id="housesList" class="row g-3"></div>
      </section>

      <section class="content-card simple-card list-container mt-4 mb-4">
        <div class="section-heading simple-section-heading">
          <h2>Members</h2>
          <span class="text-secondary">Choose a house to view its members</span>
        </div>
        <div id="membersList" class="member-list"></div>
      </section>

<!-- Toast Notification -->
<div class="toast-container position-fixed top-0 end-0 p-3">
  <div id="messageToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <strong class="me-auto" id="toastTitle">Notification</strong>
      <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
    <div class="toast-body" id="toastMessage"></div>
  </div>
</div>

<!-- Edit Member Modal -->
<div class="modal fade" id="editMemberModal" tabindex="-1" aria-labelledby="editMemberTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="editMemberForm">
        <div class="modal-header">
          <h5 class="modal-title" id="editMemberTitle">Edit Member</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <label for="editMemberName" class="form-label">Member name</label>
          <input type="text" id="editMemberName" class="form-control" maxlength="100" required>
          <p id="editMemberMessage" class="mt-2 mb-0" role="status"></p>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save changes</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Bootstrap JavaScript -->


    </main>
  </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/sidebar.js"></script>
  <script type="module" src="../js/house-page.js"></script>
</body>
</html>
