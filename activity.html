<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity History | House Bills Splitter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

</head>
<body>
  <div class="app-layout">
    <div id="sidebar-container"></div>
    <main class="main-content">
      <header class="page-heading simple-heading">
        <div>
          <p class="eyebrow">WHAT HAPPENED</p>
          <h1>Activity History</h1>
          <p class="hero-description">A log of recent changes in the selected house.</p>
        </div>
      </header>

      <div class="house-picker">
        <label for="houseSelect" class="form-label mb-0">House:</label>
        <select id="houseSelect" class="form-select"></select>
      </div>

      <section class="simple-card list-container">
        <div class="filter-row">
          <input id="searchInput" class="form-control" type="search" placeholder="Search expenses by title" aria-label="Search expenses by title">
          <select id="memberFilter" class="form-select" aria-label="Filter by member"></select>
          <select id="categoryFilter" class="form-select" aria-label="Filter by category">
            <option value="">All categories</option>
            <option>Rent</option><option>Electricity</option><option>Fuel</option>
            <option>Food</option><option>Internet</option><option>Other</option>
          </select>
          <input id="monthFilter" class="form-control" type="month" aria-label="Filter by month">
          <button id="clearFilters" class="btn btn-outline-secondary" type="button">Clear filters</button>
        </div>
        <p id="resultCount" class="text-secondary small"></p>
        <div id="activityList"></div>
      </section>
    </main>
  </div>

<script src="script.js"></script>
  <div id="appToastContainer" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:2000" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
